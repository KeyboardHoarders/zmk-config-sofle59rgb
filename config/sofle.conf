CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_KEYBOARD_NAME="SofleChoc59"


CONFIG_ZMK_STUDIO=yes

CONFIG_ZMK_STUDIO_LOCKING=n

CONFIG_ZMK_POINTING=y

# RGB: drives all 36 LEDs per half (per-key + underglow) as one strip
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# cap brightness to stay within the nice!nano regulator's current budget
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=50
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=30
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=y
# turn LEDs off when idle / asleep to save battery
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# keep external power (nice!view) on when RGB is toggled off
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
